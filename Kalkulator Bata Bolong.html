<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Bata Bolong</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#1f1b16;--mu:#6b645a;--ac:#c2410c;--bd:#e3ddd2;--in:#faf8f4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e17;--tx:#f1ece3;--mu:#a39b8d;--ac:#fb923c;--bd:#38322a;--in:#1a1712;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:16px;max-width:480px}
h1{font-size:20px;margin:4px 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font-size:16px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.res{background:var(--ac);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:36px;font-weight:700}.res small{opacity:.9}
.t{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.t:last-child{border:0}
.n{font-size:12px;color:var(--mu);margin:0}
</style></head><body>
<h1>🧱 Kalkulator Bata Bolong</h1>
<div class="c">
<label>Ukuran bata (cm)</label>
<div class="g">
<div><label>Panjang</label><input id="p" type="number" value="16" inputmode="decimal" oninput="hit()"></div>
<div><label>Tinggi</label><input id="t" type="number" value="7" inputmode="decimal" oninput="hit()"></div>
<div><label>Tebal</label><input id="l" type="number" value="7" inputmode="decimal" oninput="hit()"></div>
</div>
<label>Luas bangunan (m²)</label>
<input id="a" type="number" value="36" inputmode="decimal" oninput="hit()">
</div>
<div class="res"><small>Kebutuhan bata</small><div class="big" id="tot">0 buah</div><small id="sub"></small></div>
<div class="c" id="rc"></div>
<p class="n">Perkiraan: dinding ≈ 2,5 × luas bangunan, dikurangi 15% untuk pintu & jendela, nat semen 1,5 cm, cadangan pecah 5%, campuran 1 semen : 4 pasir.</p>
<script>
const $=i=>document.getElementById(i),f=(n,d=0)=>n.toLocaleString("id-ID",{maximumFractionDigits:d,minimumFractionDigits:d});
function hit(){
const p=+$("p").value/100,t=+$("t").value/100,l=+$("l").value/100,a=+$("a").value||0,sp=.015;
const net=a*2.5*.85,per=1/((p+sp)*(t+sp)),total=Math.ceil(net*per*1.05);
const m=net*l*(1-per*p*t)*1.25;
$("tot").textContent=f(total)+" buah";
$("sub").textContent=`Luas dinding ±${f(net,1)} m² • ${f(per,1)} buah/m²`;
const r=(x,y)=>`<div class="t"><span>${x}</span><b>${y}</b></div>`;
$("rc").innerHTML=r("Semen (zak 40 kg)",f(Math.ceil(m*7.5))+" zak")+r("Pasir",f(m,2)+" m³");
}
hit();
</script></body></html>
